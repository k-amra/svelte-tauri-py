name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'src-python/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/tests/**'
      - 'bun.lock'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - '.github/workflows/test-build.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: true

    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Must match `packageManager` in package.json (lockfile stability).
          bun-version: '1.4.2'
          # Restores ~/.bun/install/cache keyed on bun.lock.
          cache: true
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Sync Python deps (frozen)
        run: uv sync --project src-python --frozen

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # fmt/clippy/test share a target dir; caching saves ~3-5 min per PR.

      # Must run before fmt/clippy: those compile webkit2gtk sys-crates,
      # which need the system libs present or the build fails on pkg-config.
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri_build::build() (invoked by src-tauri/build.rs) validates that
      # every externalBin entry exists BEFORE clippy/test can compile the
      # crate. The real sidecar is built later (PyInstaller is slow), so seed
      # a placeholder here; build:sidecar overwrites it before `tauri build`.
      # The triple carries the OS, so derive the Windows .exe suffix from it
      # (tauri_build demands api-server-<triple>.exe on Windows, extensionless
      # elsewhere — mirroring build-sidecar.mjs).
      - name: Seed placeholder sidecar (for fmt/clippy/test)
        run: |
          triple="$(rustc --print host-tuple)"
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/api-server-${triple}"
          if [[ "$triple" == *-windows-* ]]; then
            touch "src-tauri/binaries/api-server-${triple}.exe"
          fi
          chmod +x src-tauri/binaries/api-server-*

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # Warn-only (no -D warnings): the toolchain floats on stable, so new
      # clippy lints must not break unrelated PRs. Pedantic stays an
      # editor-side nudge via rust-analyzer settings.
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Type check (svelte-check + tsc)
        run: bun run check

      - name: Lint (prettier + eslint)
        run: bun run lint

      - name: Lint (ruff)
        run: bun run lint:python

      - name: Frontend unit tests (Vitest)
        run: bun run test:unit

      - name: Python tests (pytest)
        run: bun run test:python

      - name: Rust unit tests (cargo test)
        run: bun run test:rust

      - name: Build sidecar (PyInstaller)
        run: bun run build:sidecar

      - name: Build Tauri
        env:
          # The sidecar was already built (and would be rebuilt unsigned by
          # beforeBuildCommand) — reuse the prebuilt binary instead.
          SIDECAR_PREBUILT: '1'
        run: bun run tauri build
