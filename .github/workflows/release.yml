name: 'publish'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (for example, v2.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Draft release + asset-upload is not atomic; cancelling mid-matrix leaves a
  # partial draft. Let the previous run finish — the idempotency gate
  # (`Reject an already-published release`) makes a re-run safe.
  cancel-in-progress: false

jobs:
  validate-release:
    permissions:
      contents: read
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$tag' must use the stable SemVer format vMAJOR.MINOR.PATCH."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate version metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const expected = process.env.RELEASE_VERSION;
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');
          const pyproject = fs.readFileSync('src-python/pyproject.toml', 'utf8');

          if (!fs.existsSync('bun.lock')) {
            console.error('::error file=bun.lock::bun.lock is missing.');
            process.exit(1);
          }

          const cargoManifestVersion = cargoToml.match(
            /^\[package\][\s\S]*?^version = "([^"]+)"/m
          )?.[1];
          const cargoLockVersion = cargoLock.match(
            /\[\[package\]\]\r?\nname = "app"\r?\nversion = "([^"]+)"/
          )?.[1];
          const pyprojectVersion = pyproject.match(/^version = "([^"]+)"/m)?.[1];

          // Add a new entry here when a source of truth is introduced.
          // NOTE: src-python/app/__init__.py is intentionally NOT checked —
          // it holds no version today. If you add `__version__ = "..."`,
          // add a regex like the pyproject one above and register it here.
          const versions = {
            'package.json': packageJson.version,
            'src-tauri/tauri.conf.json': tauriConfig.version,
            'src-tauri/Cargo.toml': cargoManifestVersion,
            'src-tauri/Cargo.lock app package': cargoLockVersion,
            'src-python/pyproject.toml': pyprojectVersion
          };

          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (mismatches.length > 0) {
            for (const [source, version] of mismatches) {
              console.error(`::error file=${source}::Expected version ${expected}, found ${version ?? 'missing'}.`);
            }
            process.exit(1);
          }
          NODE

      - name: Reject an already-published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published and cannot be rebuilt."
              exit 1
            fi
          fi

  publish-tauri:
    needs: validate-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          # Intel Macs: PyInstaller can't cross-compile, so this needs its own
          # runner — but GitHub has retired all Intel-hosted macOS images
          # (macos-13 and macos-15-intel). Re-add with a self-hosted Intel
          # runner if x86_64-apple-darwin builds are needed again.
          # - platform: 'self-hosted-macos-intel'
          #   args: '--target x86_64-apple-darwin'
          #   target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Must match `packageManager` in package.json (lockfile stability).
          bun-version: '1.4.2'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build sidecar (PyInstaller)
        shell: bash
        run: bun run build:sidecar -- --target ${{ matrix.target }}

      # Sign the sidecar exe BEFORE `tauri build` (Windows/macOS).
      # Configure SIGN_COMMAND (win) / IDENTITY (mac) secrets; unsigned builds
      # trigger SmartScreen / Gatekeeper. See plan.md installer §3.
      - name: Sign sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SIGN_COMMAND: ${{ secrets.SIGN_COMMAND }}
          # Fail the release if signing is not configured (never ship unsigned).
          SIGNING_REQUIRED: '1'
        run: powershell -File scripts/sign-sidecar.ps1 -Triple ${{ matrix.target }}
      - name: Sign sidecar (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Fail the release if signing is not configured (never ship unsigned).
          SIGNING_REQUIRED: '1'
        run: bash scripts/sign-sidecar.sh ${{ matrix.target }}

      - name: Require Apple signing secrets (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGNING_REQUIRED: '1'
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::error::APPLE_CERTIFICATE is empty and SIGNING_REQUIRED=1 — refusing to ship an unsigned macOS build."
            exit 1
          fi

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reuse the signed sidecar: tauri build's beforeBuildCommand would
          # otherwise rebuild (and clobber the signature) via build-sidecar.mjs.
          # NOTE: the skip check matches on the HOST triple (beforeBuildCommand
          # runs without --target), so this only works while every matrix entry
          # builds natively on its runner. A cross-compile entry would miss the
          # guard and rebuild (wasted work, but no corruption: different filename).
          SIDECAR_PREBUILT: '1'
          # macOS app signing + notarization (tauri-action picks these up
          # automatically; empty secrets = unsigned, same as before).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_NAME: ${{ secrets.APPLE_TEAM_NAME }}
        with:
          tagName: ${{ needs.validate-release.outputs.tag }}
          releaseName: ${{ needs.validate-release.outputs.tag }}
          releaseBody: 'See [CHANGELOG.md](https://github.com/alysonhower/tauri2-svelte5-shadcn/blob/${{ needs.validate-release.outputs.tag }}/CHANGELOG.md) for a complete list of changes.'
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          # Production CSP: no http://localhost:1420. Dev-only origins stay in
          # tauri.conf.json for `tauri dev` and are stripped from release builds.
          args: ${{ matrix.args }} --config src-tauri/tauri.prod.conf.json

  publish-release:
    needs:
      - validate-release
      - publish-tauri
    permissions:
      contents: write
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Verify release assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)"

          if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG must still be a draft before publication."
            exit 1
          fi

          if [[ "$(jq -r '.isPrerelease' <<< "$release_json")" != "false" ]]; then
            echo "::error::Release $RELEASE_TAG must not be marked as a prerelease."
            exit 1
          fi

          asset_count="$(jq '[.assets[] | select(.size > 0)] | length' <<< "$release_json")"
          if [[ "$asset_count" -lt 7 ]]; then
            echo "::error::Expected at least 7 non-empty release assets, found $asset_count."
            jq -r '.assets[] | "\(.name) (\(.size) bytes)"' <<< "$release_json"
            exit 1
          fi

          for suffix in '.dmg' '.app.tar.gz' '.AppImage' '.deb' '.rpm' '.exe' '.msi'; do
            if ! jq -e --arg suffix "$suffix" \
              '[.assets[] | select(.size > 0 and (.name | endswith($suffix)))] | length >= 1' \
              <<< "$release_json" >/dev/null; then
              echo "::error::Missing non-empty $suffix release asset."
              exit 1
            fi
          done

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --verify-tag
